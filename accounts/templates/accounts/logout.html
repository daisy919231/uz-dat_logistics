{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out | DAT-UZ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .logout-container {
            background: white;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
    </style>
</head>
<body>
    <div class="logout-container">
        <div class="mb-6">
            <i class="fas fa-check-circle text-4xl text-green-500 mb-4"></i>
            <h1 class="text-2xl font-bold text-gray-800 mb-2">You've Been Logged Out</h1>
            <p class="text-gray-600">Thank you for using DAT-UZ. You have successfully signed out.</p>
        </div>
        
        <div class="flex justify-center">
            <!-- Homepage Button -->
            <a href="{% url 'accounts:homepage' %}" 
               class="inline-flex items-center justify-center px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors">
                <i class="fas fa-home mr-2"></i> Return to Homepage
            </a>
        </div>
        
        <div class="mt-6 text-sm text-gray-500">
            Want to sign in again? <a href="{% url 'accounts:login' %}" class="text-blue-600 hover:underline">Click here</a>
        </div>
    </div>
</body>
</html>
